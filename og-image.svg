<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090E"/>
      <stop offset="50%" stop-color="#0C0E16"/>
      <stop offset="100%" stop-color="#10131C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B8CFF"/>
      <stop offset="50%" stop-color="#5B6CFF"/>
      <stop offset="100%" stop-color="#00D9A0"/>
    </linearGradient>
    <linearGradient id="iconG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F5FFF"/>
      <stop offset="100%" stop-color="#00C48C"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#5B6CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5B6CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#00D9A0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00D9A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Left content -->
  <!-- Icon -->
  <rect x="80" y="120" width="64" height="64" rx="16" fill="url(#iconG)"/>
  <path d="M96 152l12 12 24-26" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brand -->
  <text x="160" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#F4F7FB">SiteAudit</text>

  <!-- Title -->
  <text x="80" y="280" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="700" fill="#F4F7FB">Complete SEO Audit</text>
  <text x="80" y="345" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="700" fill="url(#accent)">for Your Website</text>

  <!-- Subtitle -->
  <text x="80" y="410" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" fill="#9AA3B8">170+ issues · Core Web Vitals · Prioritized fixes</text>

  <!-- Badge -->
  <rect x="80" y="460" width="220" height="40" rx="20" fill="rgba(91,108,255,0.15)" stroke="rgba(91,108,255,0.4)" stroke-width="1"/>
  <circle cx="106" cy="480" r="5" fill="#00D9A0"/>
  <text x="122" y="486" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#A8B4FF">Free audit · No card</text>

  <!-- Right: score card mock -->
  <rect x="780" y="130" width="340" height="370" rx="24" fill="#151824" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <!-- Gauge circle -->
  <circle cx="950" cy="280" r="88" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14"/>
  <circle cx="950" cy="280" r="88" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"
    stroke-dasharray="420" stroke-dashoffset="95" transform="rotate(-90 950 280)"/>
  <text x="950" y="275" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="48" font-weight="700" fill="#F4F7FB">86</text>
  <text x="950" y="305" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#9AA3B8" letter-spacing="2">HEALTH</text>

  <!-- Metric rows -->
  <g font-family="ui-monospace, monospace" font-size="13">
    <circle cx="820" cy="420" r="5" fill="#FF6B4A"/>
    <text x="838" y="425" fill="#9AA3B8">Errors</text>
    <text x="1040" y="425" fill="#F4F7FB" font-weight="700">12</text>

    <circle cx="820" cy="455" r="5" fill="#FFB020"/>
    <text x="838" y="460" fill="#9AA3B8">Warnings</text>
    <text x="1040" y="460" fill="#F4F7FB" font-weight="700">34</text>

    <circle cx="820" cy="490" r="5" fill="#00D9A0"/>
    <text x="838" y="495" fill="#9AA3B8">Passed</text>
    <text x="1040" y="495" fill="#F4F7FB" font-weight="700">128</text>
  </g>
</svg>
